name: Build Glyph Control app

# Builds the whole app in the cloud and publishes the APK under "Releases".
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write project files
        run: |
            mkdir -p app/libs app/src/main/java/com/example/glyphcontrol
            cat > settings.gradle.kts <<'EOF_FILE'
            pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "GlyphControl"
            include(":app")
            EOF_FILE
            cat > build.gradle.kts <<'EOF_FILE'
            plugins {
                id("com.android.application") version "8.7.3" apply false
                id("org.jetbrains.kotlin.android") version "2.0.21" apply false
            }
            EOF_FILE
            cat > gradle.properties <<'EOF_FILE'
            org.gradle.jvmargs=-Xmx3g
            android.useAndroidX=true
            android.suppressUnsupportedCompileSdk=36
            EOF_FILE
            cat > app/build.gradle.kts <<'EOF_FILE'
            plugins {
                id("com.android.application")
                id("org.jetbrains.kotlin.android")
            }

            android {
                namespace = "com.example.glyphcontrol"
                compileSdk = 35

                defaultConfig {
                    applicationId = "com.example.glyphcontrol"
                    minSdk = 34
                    targetSdk = 36
                    versionCode = 1
                    versionName = "1.0"
                }

                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
                kotlinOptions {
                    jvmTarget = "17"
                }
            }

            dependencies {
                implementation(fileTree(mapOf("dir" to "libs", "include" to listOf("*.aar"))))
            }
            EOF_FILE
            cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                <uses-permission android:name="com.nothing.ketchum.permission.ENABLE" />
                <uses-permission android:name="android.permission.READ_PHONE_STATE" />
                <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

                <application
                    android:allowBackup="true"
                    android:label="Glyph Control"
                    android:theme="@android:style/Theme.Material.NoActionBar">

                    <meta-data
                        android:name="NothingKey"
                        android:value="test" />

                    <service
                        android:name=".CallGlyphService"
                        android:exported="false"
                        android:foregroundServiceType="specialUse">
                        <property
                            android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                            android:value="glyph_call_lights" />
                    </service>

                    <activity
                        android:name=".MainActivity"
                        android:exported="true">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>

            </manifest>
            EOF_FILE

      - name: Get Nothing Glyph SDK
        run: |
            git clone --depth 1 https://github.com/Nothing-Developer-Programme/Glyph-Developer-Kit sdk1
            git clone --depth 1 https://github.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit sdk2
            AAR=$(find sdk1 -name '*.aar' | sort | tail -n 1)
            if [ -z "$AAR" ]; then AAR=$(find sdk2 -name '*.aar' | sort | tail -n 1); fi
            if [ -z "$AAR" ]; then echo "No SDK .aar found"; exit 1; fi
            echo "Using SDK: $AAR"
            cp "$AAR" app/libs/nothing-glyph-sdk.aar

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glyph-build-${{ github.run_number }}
          name: Glyph Control build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
